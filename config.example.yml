  CommandsPrefix: "," # The prefix for custom commands

  CustomCommands: # You can add unlimited commands!
    - command: "pp"
      response: " \n fnf only (no note) \n once sent please send a uncropped screenshot"
      Embed: true # Use an embed instead of a normal message?
      deleteMsg: false # Delete the message author's message when using this command? (It's recommended to leave this false if replyToUser is set to true)
      replyToUser: true # Reply to the user with the response that sent the command?

    - command: "ca"
      response: "Payment tag: configure before use. \n Once sent, please send the receipt."
      Embed: true # Use an embed instead of a normal message?
      deleteMsg: false # Delete the message author's message when using this command? (It's recommended to leave this false if replyToUser is set to true)
      replyToUser: true # Reply to the user with the response that sent the command?

    - command: "test3"
      response: "This is a test!"
      Embed: false # Use an embed instead of a normal message?
      deleteMsg: false # Delete the message author's message when using this command? (It's recommended to leave this false if replyToUser is set to true)
      replyToUser: false # Reply to the user with the response that sent the command?

